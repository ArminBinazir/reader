<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfaf8">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marginalia Reader">
<title>Marginalia Reader</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face { font-family: "Newsreader"; src: url("newsreader.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
@font-face { font-family: "Inter"; src: url("inter.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
:root {
  --bg: #fcfaf8; --card: #ffffff; --ink: #221f1b; --muted: #746b63; --line: #eae6e1; --chip: #f4f1ec;
  --accent: #db4f24; --accent-soft: #f8dcd3; --accent-ink: #ffffff;
  --shadow: 0 1px 3px rgba(34,31,27,.06), 0 8px 24px rgba(34,31,27,.06);
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --navh: calc(74px + env(safe-area-inset-bottom, 0px));
  --mini: 0px;
}
body.in-reader { --navh: 0px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.4; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { width: 24px; height: 24px; display: block; }
.ib { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; }
.ib:active { background: var(--chip); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.serif { font-family: var(--serif); }

/* ---------- home ---------- */
main { max-width: 720px; margin: 0 auto; padding: calc(30px + env(safe-area-inset-top, 0px)) 20px calc(var(--navh) + 110px); }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
.head h1 { font-family: var(--serif); font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -.015em; margin: 0 0 8px; }
.head p { margin: 0; font-size: 18px; color: var(--muted); }
.head .ib { margin-top: 2px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
#msg { color: #b3261e; font-size: 14px; margin: 0 0 10px; }

.seg3 { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 30px; padding: 6px; box-shadow: var(--shadow); gap: 4px; }
.seg3 button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 6px; border-radius: 24px; font-size: 16px; font-weight: 600; color: var(--muted); }
.seg3 .n { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--chip); display: inline-grid; place-items: center; font-size: 13px; font-weight: 600; }
.seg3 button.on { background: var(--accent); color: var(--accent-ink); }
.seg3 button.on .n { background: rgba(255,255,255,.25); color: #fff; }

.view { margin-top: 26px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 26px 16px; }
.bk { cursor: pointer; min-width: 0; }
.cover { background-size: cover; background-position: center; display: grid; place-items: center; color: rgba(255,255,255,.88); font-family: var(--serif); font-weight: 700; overflow: hidden; flex: none; position: relative; }
.cover span { text-shadow: 0 1px 8px rgba(0,0,0,.3); font-size: 34px; }
.bk .cover { width: 100%; aspect-ratio: 2 / 3; border-radius: 14px; box-shadow: 0 8px 22px rgba(34,31,27,.18); }
.cover .pbar { position: absolute; left: 0; bottom: 0; height: 7px; background: var(--accent); }
.bk .tt { font-family: var(--serif); font-weight: 700; font-size: 18px; line-height: 1.15; margin-top: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.bk .au { color: var(--muted); font-size: 13.5px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk .mt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.bk .mt svg { width: 16px; height: 16px; }
.empty { padding: 22px 6px; color: var(--muted); font-size: 15px; }

.crumb { display: flex; align-items: center; gap: 2px; margin: 0 0 12px -8px; }
.crumb .ct { font-family: var(--serif); font-size: 24px; font-weight: 700; word-break: break-word; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:active { background: var(--chip); }
.row .tile { width: 44px; height: 44px; border-radius: 12px; background: var(--chip); display: grid; place-items: center; color: var(--muted); flex: none; }
.row .cover { width: 44px; height: 66px; border-radius: 7px; }
.row .cover span { font-size: 20px; }
.row .rt { min-width: 0; flex: 1; }
.row .rn { font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.2; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .rs { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* ---------- bottom nav ---------- */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; background: rgba(252,250,248,.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
       border-top: 1px solid var(--line); padding: 10px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
body.in-reader #nav { display: none; }
#nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; }
#nav a.on { color: var(--accent); }
#nav svg { width: 26px; height: 26px; }

/* ---------- mini player ---------- */
#mini { position: fixed; left: 12px; right: 12px; bottom: calc(var(--navh) + 10px); z-index: 30; display: none; align-items: center; gap: 12px; max-width: 696px; margin: 0 auto;
        background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 10px 8px 8px; box-shadow: var(--shadow); cursor: pointer; overflow: hidden; }
#mini .cover { width: 40px; height: 60px; border-radius: 6px; }
#mini .cover span { font-size: 18px; }
#mini .mt { flex: 1; min-width: 0; }
#miniTitle { font-family: var(--serif); font-weight: 700; font-size: 16px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#miniSub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
#miniProg { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; }
#miniPlay { background: var(--accent); color: var(--accent-ink); width: 44px; height: 44px; }
#miniPlay:active { opacity: .85; background: var(--accent); }

/* ---------- full player ---------- */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 40; display: none; flex-direction: column; }
.sheet.open { display: flex; }
.fp-top { display: flex; align-items: center; justify-content: space-between; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 0; }
.fp-scroll { flex: 1; overflow-y: auto; padding: 0 24px calc(40px + env(safe-area-inset-bottom, 0px)); max-width: 560px; width: 100%; margin: 0 auto; text-align: center; }
#fpCover { width: min(52vw, 230px); aspect-ratio: 2 / 3; border-radius: 16px; margin: 4px auto 22px; box-shadow: 0 14px 36px rgba(34,31,27,.25); }
#fpCover span { font-size: 70px; }
.t1 { font-size: 26px; font-weight: 700; line-height: 1.12; letter-spacing: -.01em; }
#fpChapter { margin-top: 14px; font-size: 14.5px; color: var(--accent); font-weight: 600; min-height: 20px; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; margin: 14px 0 0; }
.times { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -2px; }
.transport { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 10px; }
.transport .ib { width: 56px; height: 56px; border-radius: 28px; }
.transport .ib svg { width: 30px; height: 30px; }
.transport .big { width: 74px; height: 74px; border-radius: 37px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 22px rgba(219,79,36,.35); }
.transport .big:active { background: var(--accent); opacity: .85; }
.transport .big svg { width: 34px; height: 34px; }
.chips { display: flex; gap: 10px; justify-content: center; margin: 16px 0 6px; flex-wrap: wrap; }
.chip { padding: 10px 18px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); font-size: 14.5px; font-weight: 600; box-shadow: var(--shadow); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
h3.cl { text-align: left; font-family: var(--serif); font-size: 22px; font-weight: 700; margin: 28px 0 10px; }
#chapList { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
.chap { display: flex; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.chap:first-child { border-top: 0; }
.chap .cn { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 54px; font-size: 13px; padding-top: 2px; }
.chap.now { color: var(--accent); font-weight: 600; }
.chap:active { background: var(--chip); }

/* ---------- epub reader ---------- */
#reader { position: fixed; left: 0; right: 0; top: 0; bottom: var(--mini); z-index: 20; display: none; background: var(--rbg); color: var(--rfg);
          --rbg: #fcfaf8; --rfg: #221f1b; --rmuted: #746b63; --rline: #eae6e1; --racc: #db4f24; }
#reader[data-theme=sepia] { --rbg: #f1e6cf; --rfg: #3b2f1e; --rmuted: #8a7a60; --rline: #dccfb3; --racc: #b4531c; }
#reader[data-theme=night] { --rbg: #14130f; --rfg: #d8d1c2; --rmuted: #8d8777; --rline: #2b2924; --racc: #ee7a52; }
#rtop, #rbot { position: absolute; left: 0; right: 0; z-index: 3; background: var(--rbg); transition: transform .2s, opacity .2s; }
#rtop { top: 0; display: flex; align-items: center; gap: 4px; padding: calc(6px + env(safe-area-inset-top, 0px)) 8px 6px; border-bottom: 1px solid var(--rline); }
#rtitle { flex: 1; min-width: 0; font-family: var(--serif); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
#rbot { bottom: 0; padding: 4px 16px 8px; border-top: 1px solid var(--rline); }
#reader.hide-chrome #rtop { transform: translateY(-100%); opacity: 0; pointer-events: none; }
#reader.hide-chrome #rbot { transform: translateY(100%); opacity: 0; pointer-events: none; }
#reader .ib:active { background: var(--rline); }
#viewer { position: absolute; left: 18px; right: 18px; top: calc(58px + env(safe-area-inset-top, 0px)); bottom: 92px; }
#zones { position: absolute; left: 0; right: 0; top: calc(58px + env(safe-area-inset-top, 0px)); bottom: 92px; z-index: 2; touch-action: none; }
#rslider { accent-color: var(--racc); margin: 4px 0 0; }
.rrow { display: flex; align-items: center; justify-content: space-between; }
#rprog { font-size: 13px; color: var(--rmuted); font-variant-numeric: tabular-nums; }
#panelBack { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.35); display: none; }
.panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 70%; overflow-y: auto; background: var(--rbg); border-top-left-radius: 24px; border-top-right-radius: 24px;
         padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: none; box-shadow: 0 -10px 30px rgba(0,0,0,.2); }
.panel h3 { margin: 0 0 12px; font-family: var(--serif); font-size: 22px; font-weight: 700; }
.toc { padding: 12px 4px; border-top: 1px solid var(--rline); font-size: 15.5px; cursor: pointer; }
.toc.now { color: var(--racc); font-weight: 600; }
.prow { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; gap: 10px; }
.prow label { color: var(--rmuted); font-size: 13px; min-width: 70px; }
.seg { display: flex; gap: 8px; flex: 1; justify-content: flex-end; flex-wrap: wrap; }
.seg button { padding: 8px 15px; border-radius: 20px; border: 1px solid var(--rline); font-size: 14px; font-weight: 600; }
.seg button.on { background: var(--racc); color: var(--rbg); border-color: var(--racc); }

/* ---------- dialogs ---------- */
#settings, #choose { z-index: 50; align-items: center; justify-content: center; background: rgba(34,31,27,.45); }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 22px; max-width: 520px; width: calc(100% - 40px); align-self: center; box-shadow: var(--shadow); }
.box h2 { font-family: var(--serif); font-size: 26px; font-weight: 700; margin: 0 0 4px; }
.box label { font-size: 13px; color: var(--muted); display: block; margin-top: 12px; }
.box input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-top: 4px; }
.btn { padding: 13px 22px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; margin-top: 16px; }
.btn.ghost { background: var(--chip); color: var(--ink); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
#chooseCover { width: 96px; aspect-ratio: 2 / 3; border-radius: 12px; box-shadow: 0 8px 22px rgba(34,31,27,.2); margin: 0 0 14px; }
</style>
</head>
<body>

<main>
  <div class="head">
    <div>
      <h1>Your reader</h1>
      <p>Listen and read, right where you left off.</p>
    </div>
    <button class="ib" id="btnSettings" aria-label="Settings"></button>
  </div>
  <div id="msg"></div>

  <div class="seg3" id="tabs">
    <button data-t="listen">Listening <span class="n" id="nListen">0</span></button>
    <button data-t="read">Reading <span class="n" id="nRead">0</span></button>
    <button data-t="browse">Browse</button>
  </div>

  <section class="view" id="shelfView">
    <div class="grid" id="grid"></div>
    <div class="empty" id="shelfEmpty"></div>
  </section>

  <section class="view" id="browseView" style="display:none">
    <div class="crumb"><button class="ib" id="btnUp" aria-label="Up one folder"></button><div class="ct" id="crumbName"></div></div>
    <div class="list" id="list"></div>
  </section>
</main>

<nav id="nav">
  <a id="navLib" href="#"><span id="icLib"></span>Library</a>
  <a class="on" href="#"><span id="icRead"></span>Reader</a>
</nav>

<!-- epub reader -->
<div id="reader" data-theme="paper">
  <div id="rtop">
    <button class="ib" id="rClose" aria-label="Close"></button>
    <div id="rtitle"></div>
    <button class="ib" id="rToc" aria-label="Contents"></button>
    <button class="ib" id="rAa" aria-label="Text settings"><span style="font-family:var(--serif);font-weight:700;font-size:19px">Aa</span></button>
  </div>
  <div id="viewer"></div>
  <div id="zones"></div>
  <div id="rbot">
    <input type="range" id="rslider" min="0" max="1000" value="0" disabled>
    <div class="rrow">
      <button class="ib" id="rPrev" aria-label="Previous page"></button>
      <span id="rprog"></span>
      <button class="ib" id="rNext" aria-label="Next page"></button>
    </div>
  </div>
  <div id="panelBack"></div>
  <div class="panel" id="tocPanel"><h3>Contents</h3><div id="tocList"></div></div>
  <div class="panel" id="aaPanel">
    <h3>Text</h3>
    <div class="prow"><label>Theme</label><div class="seg" id="segTheme"><button data-v="paper">Paper</button><button data-v="sepia">Sepia</button><button data-v="night">Night</button></div></div>
    <div class="prow"><label>Size</label><div class="seg"><button id="fMinus">A-</button><button id="fVal" style="pointer-events:none"></button><button id="fPlus">A+</button></div></div>
    <div class="prow"><label>Font</label><div class="seg" id="segFont"><button data-v="serif">Serif</button><button data-v="sans">Sans</button></div></div>
    <div class="prow"><label>Spacing</label><div class="seg" id="segSpace"><button data-v="1.3">Tight</button><button data-v="1.5">Normal</button><button data-v="1.75">Airy</button></div></div>
  </div>
</div>

<!-- mini player -->
<div id="mini">
  <div id="miniProg"></div>
  <div class="cover" id="miniCover"></div>
  <div class="mt"><div id="miniTitle"></div><div id="miniSub"></div></div>
  <button class="ib" id="miniPlay" aria-label="Play or pause"></button>
</div>

<!-- full player -->
<div class="sheet" id="fp">
  <div class="fp-top"><button class="ib" id="fpClose" aria-label="Close player"></button><span></span></div>
  <div class="fp-scroll">
    <div class="cover" id="fpCover"></div>
    <div class="t1 serif" id="fpTitle"></div>
    <div class="muted" id="fpAuthor" style="margin-top:4px"></div>
    <div id="fpChapter"></div>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1">
    <div class="times"><span id="tNow">0:00</span><span id="tLeft">-0:00</span></div>
    <div class="transport">
      <button class="ib" id="bPrev" aria-label="Previous chapter"></button>
      <button class="ib" id="bBack" aria-label="Back 30 seconds"></button>
      <button class="ib big" id="bPlay" aria-label="Play or pause"></button>
      <button class="ib" id="bFwd" aria-label="Forward 30 seconds"></button>
      <button class="ib" id="bNext" aria-label="Next chapter"></button>
    </div>
    <div class="chips"><button class="chip" id="chSpeed"></button><button class="chip" id="chSleep"></button></div>
    <div class="small muted" id="fpStatus"></div>
    <h3 class="cl">Chapters</h3>
    <div id="chapList"></div>
    <div class="small muted" id="fpTip" style="margin-top:14px;text-align:left"></div>
  </div>
</div>

<!-- listen or read chooser (used by links from Marginalia) -->
<div class="sheet" id="choose">
  <div class="box">
    <div class="cover" id="chooseCover"></div>
    <h2 id="chooseTitle"></h2>
    <div class="muted" id="chooseSub" style="margin-bottom:6px"></div>
    <div class="btns"><button class="btn" id="chooseListen">Listen</button><button class="btn" id="chooseRead">Read</button><button class="btn ghost" id="chooseCancel">Cancel</button></div>
  </div>
</div>

<!-- settings -->
<div class="sheet" id="settings">
  <div class="box">
    <h2>Settings</h2>
    <label>Server address (ends with /reader)</label>
    <input id="base" placeholder="https://YOUR-PROJECT-REF.supabase.co/functions/v1/reader" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label>Access key</label>
    <input id="key" type="password" placeholder="Your APP_TOKEN" autocapitalize="off" autocorrect="off">
    <div class="btns"><button class="btn" id="btnSave">Save</button><button class="btn ghost" id="btnCancel">Cancel</button></div>
  </div>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
<script>
function $(id) { return document.getElementById(id); }
var audio = $('audio');
var MARGINALIA_URL = 'https://marginalia.armin-binazir.workers.dev';

/* ================= icons ================= */
var S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
var ICONS = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  back30: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/><text x="12" y="16.2" font-size="7" text-anchor="middle" font-family="system-ui" font-weight="700">30</text></svg>',
  fwd30: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V2l4 4-4 4V7a5 5 0 1 0 5 5h2a7 7 0 1 1-7-7z"/><text x="12" y="16.2" font-size="7" text-anchor="middle" font-family="system-ui" font-weight="700">30</text></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  list: '<svg viewBox="0 0 24 24" ' + S + '><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  chevDown: '<svg viewBox="0 0 24 24" ' + S + '><path d="M6 9l6 6 6-6"/></svg>',
  chevLeft: '<svg viewBox="0 0 24 24" ' + S + '><path d="M15 6l-6 6 6 6"/></svg>',
  chevRight: '<svg viewBox="0 0 24 24" ' + S + '><path d="M9 6l6 6-6 6"/></svg>',
  sliders: '<svg viewBox="0 0 24 24" ' + S + '><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',

/* ================= config, api, storage ================= */
var cfg = { base: localStorage.getItem('base') || '', key: localStorage.getItem('key') || '' };

function api(route, params) {
  var u = new URL(cfg.base.replace(/\/+$/, '') + '/' + route);
  for (var k in (params || {})) u.searchParams.set(k, params[k]);
  u.searchParams.set('key', cfg.key);
  return u.toString();
}

async function rangeRead(path, a, b) {
  var r = await fetch(api('file', { path: path }), { headers: { Range: 'bytes=' + a + '-' + b } });
  if (r.status !== 206) { try { if (r.body) r.body.cancel(); } catch (e) {} throw new Error('range ' + r.status); }
  var cr = r.headers.get('content-range');
  return { buf: await r.arrayBuffer(), total: cr ? parseInt(cr.split('/')[1], 10) : 0 };
}

function cacheGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function cacheSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function metaGet(path) { try { return JSON.parse(cacheGet('meta:' + path) || 'null'); } catch (e) { return null; } }

function nameOf(p) { var parts = p.split('/').filter(Boolean); return parts.length ? parts[parts.length - 1] : ''; }
function titleOf(path) {
  var m = metaGet(path);
  if (m && m.title) return m.title;
  return nameOf(path).replace(/\.[a-z0-9]{2,5}$/i, '').replace(/\s*\([^)]*(?:z-?lib|1lib|library\.sk)[^)]*\)/gi, '').trim();
}
function authorOf(path) { var m = metaGet(path); return m && m.author ? m.author : ''; }
function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function fmt(sec) {
  if (!isFinite(sec)) return '0:00';
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') : m + ':' + String(s).padStart(2, '0');
}
function showMsg(t) { $('msg').textContent = t || ''; }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function paintCover(d, path, title) {
  d.innerHTML = '';
  d.style.backgroundImage = ''; d.style.background = '';
  var thumb = cacheGet('cv:' + path);
  if (thumb) { d.style.backgroundImage = 'url("' + thumb + '")'; return d; }
  var h = hash(title || path), hue = 12 + (h % 40);
  d.style.background = 'linear-gradient(160deg, hsl(' + hue + ' 55% 46%), hsl(' + (hue + 330) % 360 + ' 40% 22%))';
  d.appendChild(el('span', '', ((title || '?').trim()[0] || '?').toUpperCase()));
  return d;
}
function coverEl(path, title, cls) { var d = el('div', 'cover ' + (cls || '')); return paintCover(d, path, title); }

function makeThumb(source, px) {
  return new Promise(function (resolve) {
    var url, made = false;
    if (typeof source === 'string') url = source;
    else { url = URL.createObjectURL(new Blob([source.bytes], { type: source.mime })); made = true; }
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, px / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      if (made) URL.revokeObjectURL(url);
      try { resolve(c.toDataURL('image/jpeg', 0.82)); } catch (e) { resolve(null); }
    };
    img.onerror = function () { if (made) URL.revokeObjectURL(url); resolve(null); };
    img.src = url;

}

/* Reads cover, title, author and chapters out of an m4b/m4a/mp4 using small Range requests.
   Needs a global async function rangeRead(path, startByte, endByteInclusive) -> { buf: ArrayBuffer, total: number } */

function fourcc(dv, o) {
  return String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
}

function boxAt(dv, o, end) {
  if (o + 8 > end) return null;
  var size = dv.getUint32(o), type = fourcc(dv, o + 4), hs = 8;
  if (size === 1) {
    if (o + 16 > end) return null;
    size = Number(dv.getBigUint64(o + 8));
    hs = 16;
  } else if (size === 0) {
    size = end - o;
  }
  if (size < hs) return null;
  return { type: type, start: o, size: size, hs: hs };
}

function kidsOf(dv, parent, limit) {
  var out = [], o = parent.start + parent.hs, end = Math.min(parent.start + parent.size, limit || dv.byteLength), b;
  while ((b = boxAt(dv, o, end))) {
    out.push(b);
    o += b.size;
    if (o >= end) break;
  }
  return out;
}

function findKid(dv, parent, type) {
  var list = kidsOf(dv, parent);
  for (var i = 0; i < list.length; i++) if (list[i].type === type) return list[i];
  return null;
}

/* ---- locate the moov (index) box without downloading the audio ---- */
async function findMoov(path) {
  var first = await rangeRead(path, 0, 15);
  var total = first.total;
  var o = 0, guard = 0, mdatAt = -1;
  while (o < total && guard++ < 30) {
    var h = o === 0 ? first : await rangeRead(path, o, Math.min(o + 15, total - 1));
    var dv = new DataView(h.buf);
    var raw = dv.getUint32(0);
    var b = boxAt(dv, 0, dv.byteLength);
    if (!b) return null;
    var size = raw === 0 ? total - o : b.size;
    if (b.type === 'mdat') mdatAt = o;
    if (b.type === 'moov') return { start: o, size: size, hs: b.hs, total: total, moovAtEnd: mdatAt >= 0 && mdatAt < o };
    o += size;
  }
  return null;
}

/* ---- list the direct children of moov by reading only their 16-byte headers ---- */
async function moovParts(path, mv) {
  var end = mv.start + mv.size, o = mv.start + mv.hs, parts = [], guard = 0;
  while (o < end && guard++ < 40) {
    var h = await rangeRead(path, o, Math.min(o + 15, end - 1));
    var dv = new DataView(h.buf);
    var b = boxAt(dv, 0, dv.byteLength);
    if (!b) break;
    parts.push({ type: b.type, start: o, size: b.size });
    o += b.size;
  }
  return parts;
}

/* ---- udta: iTunes-style tags, cover, and Nero chapters ---- */
function parseChpl(dv, c) {
  var o = c.start + c.hs, end = c.start + c.size;
  var version = dv.getUint8(o);
  o += 4;
  if (version === 1) o += 4;
  var n = dv.getUint8(o);
  o += 1;
  var out = [], td = new TextDecoder('utf-8');
  for (var i = 0; i < n && o + 9 <= end; i++) {
    var t = Number(dv.getBigUint64(o)); o += 8;
    var len = dv.getUint8(o); o += 1;
    out.push({ start: t / 1e7, title: td.decode(new Uint8Array(dv.buffer, dv.byteOffset + o, len)) });
    o += len;

}

function parseUdta(buf) {
  var dv = new DataView(buf), res = { tags: {}, cover: null, chpl: [] };
  var ub = boxAt(dv, 0, dv.byteLength);
  if (!ub) return res;
  kidsOf(dv, ub).forEach(function (c) {
    if (c.type === 'chpl') {
      try { res.chpl = parseChpl(dv, c); } catch (e) {}
    } else if (c.type === 'meta') {
      var meta = { type: 'meta', start: c.start + 4, size: c.size - 4, hs: c.hs };
      var ilst = findKid(dv, meta, 'ilst');
      if (!ilst) return;
      kidsOf(dv, ilst).forEach(function (item) {
        var data = findKid(dv, item, 'data');

        } else {
          res.tags[item.type] = new TextDecoder('utf-8').decode(bytes);
        }

    }

}

/* ---- QuickTime chapter text track ---- */
function parseTextTrak(buf) {
  var dv = new DataView(buf), tb = boxAt(dv, 0, dv.byteLength);
  if (!tb || tb.type !== 'trak') return null;
  var mdia = findKid(dv, tb, 'mdia');
  if (!mdia) return null;
  var hdlr = findKid(dv, mdia, 'hdlr');
  if (!hdlr) return null;
  var htype = fourcc(dv, hdlr.start + hdlr.hs + 8);
  if (htype !== 'text' && htype !== 'sbtl' && htype !== 'subt') return null;
  var mdhd = findKid(dv, mdia, 'mdhd');
  var minf = findKid(dv, mdia, 'minf');
  var stbl = minf && findKid(dv, minf, 'stbl');
  if (!mdhd || !stbl) return null;
  var ver = dv.getUint8(mdhd.start + mdhd.hs);
  var timescale = dv.getUint32(mdhd.start + mdhd.hs + 4 + (ver === 1 ? 16 : 8));

  var stts = findKid(dv, stbl, 'stts'), stsz = findKid(dv, stbl, 'stsz'), stsc = findKid(dv, stbl, 'stsc');

  for (i = 0; i < count; i++) sizes.push(fixed ? fixed : dv.getUint32(o + 8 + i * 4));
  // sample start times
  o = stts.start + stts.hs + 4;
  n = dv.getUint32(o);
  var starts = [], t = 0;
  for (i = 0; i < n; i++) {
    var sc = dv.getUint32(o + 4 + i * 8), delta = dv.getUint32(o + 8 + i * 8);
    for (var k = 0; k < sc; k++) { starts.push(t / timescale); t += delta; }
  }

  if (stco) {
    o = stco.start + stco.hs + 4; n = dv.getUint32(o);
    for (i = 0; i < n; i++) chunkOffs.push(dv.getUint32(o + 4 + i * 4));

    o = co64.start + co64.hs + 4; n = dv.getUint32(o);

  }
  return { starts: starts, offs: offs, sizes: sizes };
}

function decodeChapterSample(bytes) {
  if (bytes.length < 2) return '';
  var len = (bytes[0] << 8) | bytes[1];
  var body = bytes.subarray(2, 2 + len);
  if (body.length >= 2 && body[0] === 0xfe && body[1] === 0xff) return new TextDecoder('utf-16be').decode(body.subarray(2));
  if (body.length >= 2 && body[0] === 0xff && body[1] === 0xfe) return new TextDecoder('utf-16le').decode(body.subarray(2));

}

async function readTextChapters(path, tr) {
  var n = Math.min(tr.offs.length, tr.starts.length);
  if (!n) return [];
  var lo = Infinity, hi = 0, i;
  for (i = 0; i < n; i++) { lo = Math.min(lo, tr.offs[i]); hi = Math.max(hi, tr.offs[i] + tr.sizes[i]); }

    for (i = 0; i < n; i++) texts[i] = decodeChapterSample(new Uint8Array(blk.buf, tr.offs[i] - lo, tr.sizes[i]));
  } else {
    var jobs = [];

      jobs.push((function (idx) {
        return rangeRead(path, tr.offs[idx], tr.offs[idx] + tr.sizes[idx] - 1).then(function (r) {

    }

  }
  var out = [];
  for (i = 0; i < n; i++) out.push({ start: tr.starts[i], title: (texts[i] || '').trim() || 'Chapter ' + (i + 1) });

}

/* ---- put it together ---- */
async function loadAudioMeta(path) {
  var mv = await findMoov(path);
  if (!mv) return null;
  var parts = await moovParts(path, mv);
  var jobs = [];
  parts.forEach(function (p) {
    if (p.type === 'udta' && p.size < 6e6) {
      jobs.push(rangeRead(path, p.start, p.start + p.size - 1).then(function (r) { return { k: 'udta', buf: r.buf }; }));
    } else if (p.type === 'trak' && p.size < 400000) {

var MEDIA_RE = /\.(mp3|m4b|m4a|ogg|opus|epub)$/i;

async function crawl(path, depth) {
  var r = await fetch(api('list', { path: path }));
  if (!r.ok) throw new Error('list ' + r.status);
  var items = await r.json(), out = [], subs = [];
  items.forEach(function (i) {
    if (i.dir) { if (depth > 0) subs.push(i.path); }
    else if (MEDIA_RE.test(i.path)) out.push({ path: i.path, kind: /\.epub$/i.test(i.path) ? 'epub' : 'audio', size: i.size });
  });
  var rest = await Promise.all(subs.map(function (p) { return crawl(p, depth - 1).catch(function () { return []; }); }));
  rest.forEach(function (x) { out = out.concat(x); });
  return out;
}
async function getIndex(force) {
  var c = null; try { c = JSON.parse(cacheGet('idx') || 'null'); } catch (e) {}
  if (c && !force && Date.now() - c.t < 3600000) return { items: c.items, cached: true };
  var items = await crawl('/', 4);

function toks(s) { return s.toLowerCase().replace(/\.[a-z0-9]{2,5}$/, '').replace(/[^a-z0-9\u0600-\u06ff]+/g, ' ').trim().split(' ').filter(Boolean); }

  var qt = toks(q); if (!qt.length) return [];
  var groups = {};
  items.forEach(function (it) {
    var folder = it.path.replace(/[^\/]+$/, '');
    var set = {};
    toks(folder.split('/').filter(Boolean).slice(-2).join(' ') + ' ' + nameOf(it.path)).forEach(function (t) { set[t] = 1; });
    var hit = qt.filter(function (t) { return set[t]; }).length / qt.length;
    var g = groups[folder] || (groups[folder] = { folder: folder, score: 0, files: [] });
    g.score = Math.max(g.score, hit); g.files.push(it);
  });
  return Object.keys(groups).map(function (k) { return groups[k]; }).filter(function (g) { return g.score >= 0.6; }).sort(function (a, b) { return b.score - a.score; });
}

function chooseBook(g, kind) {
  var aud = g.files.filter(function (f) { return f.kind === 'audio'; }).sort(function (a, b) { return a.path.localeCompare(b.path); });
  var epb = g.files.filter(function (f) { return f.kind === 'epub'; });
  if (kind === 'audio' && aud.length) return openAudio(aud[0].path);
  if (kind === 'epub' && epb.length) return openEpub(epb[0].path);
  if (aud.length && !epb.length) return openAudio(aud[0].path);
  if (epb.length && !aud.length) return openEpub(epb[0].path);
  var first = (epb[0] || aud[0]).path;
  var mt = metaGet(first);
  paintCover($('chooseCover'), first, titleOf(first));
  $('chooseTitle').textContent = mt && mt.title ? mt.title : nameOf(g.folder.replace(/\/$/, '')) || titleOf(first);
  $('chooseSub').textContent = authorOf(first) || 'Audiobook and epub available';
  $('chooseListen').onclick = function () { $('choose').classList.remove('open'); openAudio(aud[0].path); };
  $('chooseRead').onclick = function () { $('choose').classList.remove('open'); openEpub(epb[0].path); };
  $('choose').classList.add('open');
}
$('chooseCancel').onclick = function () { $('choose').classList.remove('open'); };

async function handleDeepLink() {
  var q = new URLSearchParams(location.search), book = q.get('book'), open = q.get('open'), kind = q.get('kind');
  if (!book && !open) return;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (open) { if (/\.epub$/i.test(open)) openEpub(open); else openAudio(open); return; }
  showMsg('Looking for "' + book + '"...');
  try {
    var idx = await getIndex(false), groups = findBooks(idx.items, book);
    if (!groups.length && idx.cached) groups = findBooks((await getIndex(true)).items, book);
    if (!groups.length) { setTab('browse'); showMsg('Could not find "' + book + '" in your library.'); return; }
    showMsg('');
    chooseBook(groups[0], kind);
  } catch (e) { showMsg('Could not search the library.'); }
}

/* ================= server positions ================= */
async function fetchRow(path) {
  try { var r = await fetch(api('pos', { path: path })); var rows = await r.json(); return rows[0] || null; } catch (e) { return null; }
}
function postPos(obj) {
  fetch(api('pos'), { method: 'POST', keepalive: true, body: JSON.stringify(obj) }).catch(function () {});
}

/* ================= audio player ================= */
var A = { path: null, meta: null, metaFailed: false, chapters: [], restored: false, seeking: false, sleepAt: 0, sleepChap: -1, sleepMode: 0 };
var lastSave = 0;
var rates = [0.8, 1, 1.2, 1.5, 1.75, 2];
var sleepModes = [0, 15, 30, 45, 60, 'ch'];

function chapterIndexAt(t) {
  var idx = -1;
  for (var i = 0; i < A.chapters.length; i++) { if (A.chapters[i].start <= t + 0.3) idx = i; else break; }
  return idx;
}

function applyMeta(m) {
  A.meta = m;
  A.chapters = (m && m.chapters) ? m.chapters.slice().sort(function (a, b) { return a.start - b.start; }) : [];
  var title = titleOf(A.path), author = m && m.author ? m.author : '';
  $('fpTitle').textContent = title; $('fpAuthor').textContent = author;
  $('miniTitle').textContent = title;
  paintCover($('fpCover'), A.path, title); paintCover($('miniCover'), A.path, title);
  renderChapters();
  $('fpTip').textContent = m && m.moovAtEnd ? 'Tip: this file keeps its index at the end, so it starts slowly (about 15 seconds). Re-saving it once with the index at the front fixes that.' : '';
  setMediaSession();
  updateUI();
}

function renderChapters() {
  var box = $('chapList');
  box.innerHTML = '';
  if (!A.chapters.length) { box.appendChild(el('div', 'empty', (A.meta || A.metaFailed) ? 'No chapters found in this file.' : 'Looking for chapters...')); return; }
  A.chapters.forEach(function (c, i) {
    var d = el('div', 'chap'); d.dataset.i = i;
    d.appendChild(el('span', 'cn', fmt(c.start))); d.appendChild(el('span', '', c.title));
    d.onclick = function () { audio.currentTime = c.start; if (audio.paused) audio.play().catch(function () {}); };
    box.appendChild(d);
  });
}

async function ensureAudioMeta(path) {
  var m = metaGet(path);
  if (m) return m;
  try {
    var raw = await loadAudioMeta(path);
    if (!raw) return null;
    var m2 = { title: raw.title || '', author: raw.author || '', chapters: raw.chapters || [], moovAtEnd: !!raw.moovAtEnd };
    if (raw.cover) { var th = await makeThumb(raw.cover, 520); if (th) cacheSet('cv:' + path, th); }
    cacheSet('meta:' + path, JSON.stringify(m2));
    return m2;
  } catch (e) { return null; }
}

function openAudio(path) {
  if (A.path !== path) {
    A.path = path; A.restored = false; A.meta = null; A.metaFailed = false; A.chapters = [];
    A.sleepAt = 0; A.sleepChap = -1; A.sleepMode = 0; updateSleepChip();
    $('fpStatus').textContent = 'Loading... the first start can take up to about 15 seconds.';
    var posP = fetchRow(path);
    var m0 = metaGet(path);
    applyMeta(m0);
    if (!m0) ensureAudioMeta(path).then(function (m) { if (m && A.path === path) applyMeta(m); else if (A.path === path) { A.metaFailed = true; renderChapters(); } });
    audio.src = api('file', { path: path });
    audio.onloadedmetadata = async function () {
      var row = await posP;
      var s = row && row.kind === 'audio' ? (parseFloat(row.position) || 0) : 0;
      if (s > 0 && Math.abs(audio.currentTime - s) > 1) audio.currentTime = s;
      var sp = parseFloat(cacheGet('speed:' + path) || '1'); audio.playbackRate = sp; updateSpeedChip();
      A.restored = true;
      $('fpStatus').textContent = s > 0 ? 'Resumed at ' + fmt(s) : '';
      updateUI();
    };
  }
  $('mini').style.display = 'flex';
  syncInset();
  audio.play().catch(function () { $('fpStatus').textContent = 'Tap play to start.'; });
  openPlayer();
}

function openPlayer() { $('fp').classList.add('open'); updateUI(); }
function closePlayer() { $('fp').classList.remove('open'); }
$('mini').onclick = openPlayer;
$('fpClose').onclick = closePlayer;
$('miniPlay').onclick = function (e) { e.stopPropagation(); togglePlay(); };
$('bPlay').onclick = togglePlay;
function togglePlay() { if (!A.path) return; if (audio.paused) audio.play().catch(function () {}); else audio.pause(); }
function skip(d) { audio.currentTime = Math.max(0, Math.min(audio.duration || 1e9, audio.currentTime + d)); }
$('bBack').onclick = function () { skip(-30); };
$('bFwd').onclick = function () { skip(30); };

function prevChapter() {
  if (!A.chapters.length) { skip(-300); return; }
  var i = chapterIndexAt(audio.currentTime);
  if (i >= 0 && audio.currentTime - A.chapters[i].start > 4) audio.currentTime = A.chapters[i].start;
  else audio.currentTime = A.chapters[Math.max(0, i - 1)].start;
}
function nextChapter() {
  if (!A.chapters.length) { skip(300); return; }
  var i = chapterIndexAt(audio.currentTime);
  if (i + 1 < A.chapters.length) audio.currentTime = A.chapters[i + 1].start;
}
$('bPrev').onclick = prevChapter; $('bNext').onclick = nextChapter;

function updateSpeedChip() { $('chSpeed').textContent = (audio.playbackRate || 1) + 'x'; }
$('chSpeed').onclick = function () {
  var cur = audio.playbackRate || 1, i = rates.indexOf(cur);
  var n = rates[(i + 1) % rates.length];
  audio.playbackRate = n; cacheSet('speed:' + A.path, String(n)); updateSpeedChip();
};
updateSpeedChip();

function updateSleepChip() {
  var chip = $('chSleep');
  var m = sleepModes[A.sleepMode];
  chip.classList.toggle('on', m !== 0);
  if (m === 0) chip.textContent = 'Sleep timer';
  else if (m === 'ch') chip.textContent = 'Sleep: end of chapter';
  else chip.textContent = 'Sleep: ' + m + ' min';
}
$('chSleep').onclick = function () {
  A.sleepMode = (A.sleepMode + 1) % sleepModes.length;
  var m = sleepModes[A.sleepMode];
  A.sleepAt = typeof m === 'number' && m > 0 ? Date.now() + m * 60000 : 0;
  A.sleepChap = m === 'ch' ? chapterIndexAt(audio.currentTime) : -1;
  if (m === 'ch' && !A.chapters.length) { A.sleepMode = 0; A.sleepChap = -1; }
  updateSleepChip();
};

function updateUI() {
  var d = audio.duration, t = audio.currentTime || 0, ok = isFinite(d) && d > 0;
  $('tNow').textContent = fmt(t);
  $('tLeft').textContent = ok ? '-' + fmt(d - t) : '';
  if (!A.seeking && ok) $('seek').value = Math.round(t / d * 1000);
  $('miniProg').style.width = ok ? (t / d * 100) + '%' : '0';
  var ci = chapterIndexAt(t);
  var chTitle = ci >= 0 ? A.chapters[ci].title : '';
  $('fpChapter').textContent = chTitle;
  $('miniSub').textContent = chTitle || (A.meta && A.meta.author) || '';
  var nodes = $('chapList').children;
  for (var i = 0; i < nodes.length; i++) if (nodes[i].classList) nodes[i].classList.toggle('now', i === ci);
}

$('seek').addEventListener('input', function () {
  A.seeking = true;
  var d = audio.duration; if (!isFinite(d)) return;
  var t = this.value / 1000 * d;
  $('tNow').textContent = fmt(t); $('tLeft').textContent = '-' + fmt(d - t);
});
$('seek').addEventListener('change', function () {
  var d = audio.duration;
  if (isFinite(d)) audio.currentTime = this.value / 1000 * d;
  A.seeking = false;
});

function savePos(force) {
  if (!A.path || !A.restored || !isFinite(audio.duration) || audio.duration <= 0) return;
  var now = Date.now();
  if (!force && now - lastSave < 10000) return;
  lastSave = now;
  postPos({ path: A.path, kind: 'audio', position: audio.currentTime, progress: audio.currentTime / audio.duration });
}

var lastMS = 0;
audio.addEventListener('timeupdate', function () {
  updateUI(); savePos(false);
  if (A.sleepAt && Date.now() >= A.sleepAt) { audio.pause(); A.sleepAt = 0; A.sleepMode = 0; updateSleepChip(); }
  if (A.sleepChap >= 0 && chapterIndexAt(audio.currentTime) !== A.sleepChap) { audio.pause(); A.sleepChap = -1; A.sleepMode = 0; updateSleepChip(); }
  var now = Date.now();
  if ('mediaSession' in navigator && now - lastMS > 1500 && isFinite(audio.duration)) {
    lastMS = now;
    try { navigator.mediaSession.setPositionState({ duration: audio.duration, position: Math.min(audio.currentTime, audio.duration), playbackRate: audio.playbackRate || 1 }); } catch (e) {}
  }
});
audio.addEventListener('play', function () { setIcon($('bPlay'), 'pause'); setIcon($('miniPlay'), 'pause'); });
audio.addEventListener('pause', function () { setIcon($('bPlay'), 'play'); setIcon($('miniPlay'), 'play'); savePos(true); });
audio.addEventListener('ended', function () { savePos(true); });
audio.addEventListener('durationchange', updateUI);
audio.addEventListener('error', function () { if (A.path) $('fpStatus').textContent = 'Playback error. Check the address and key in Settings.'; });
document.addEventListener('visibilitychange', function () { if (document.hidden) { savePos(true); saveEpub(true); } });

function setMediaSession() {
  if (!('mediaSession' in navigator) || !A.path) return;
  var art = cacheGet('cv:' + A.path);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: titleOf(A.path), artist: authorOf(A.path),
      artwork: art ? [{ src: art, sizes: '512x512', type: 'image/jpeg' }] : []
    });
    navigator.mediaSession.setActionHandler('play', function () { audio.play(); });
    navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
    navigator.mediaSession.setActionHandler('seekbackward', function () { skip(-30); });
    navigator.mediaSession.setActionHandler('seekforward', function () { skip(30); });
    navigator.mediaSession.setActionHandler('previoustrack', prevChapter);
    navigator.mediaSession.setActionHandler('nexttrack', nextChapter);
    navigator.mediaSession.setActionHandler('seekto', function (d) { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  } catch (e) {}
}

document.addEventListener('keydown', function (e) {
  if (e.code === 'Space' && A.path && !/INPUT|TEXTAREA|BUTTON/.test((document.activeElement || {}).tagName || '') && $('reader').style.display !== 'block') {
    e.preventDefault(); togglePlay();
  }
});

/* ================= epub reader ================= */
var book = null, rendition = null, epubPath = null, epubReady = false, locReady = false;
var currentCfi = null, currentPct = null, lastESave = 0, chromeShown = true;
var P = {
  theme: cacheGet('rTheme') || 'paper',
  fontPct: parseInt(cacheGet('fontPct') || '100', 10),
  font: cacheGet('rFont') || 'serif',
  lh: cacheGet('rLh') || '1.5'
};
var THEMES = { paper: { bg: '#fcfaf8', fg: '#221f1b' }, sepia: { bg: '#f1e6cf', fg: '#3b2f1e' }, night: { bg: '#14130f', fg: '#d8d1c2' } };
var FONTS = { serif: 'Georgia, "Iowan Old Style", "Palatino Linotype", serif', sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif' };

function syncInset() {
  var m = $('mini');
  var h = m.style.display === 'flex' ? m.offsetHeight + 20 : 0;
  document.documentElement.style.setProperty('--mini', h + 'px');
  if (rendition) { try { rendition.resize(); } catch (e) {} }
}
window.addEventListener('resize', syncInset);

async function openEpub(path) {
  closeReader(true);
  epubPath = path; epubReady = false; locReady = false; currentCfi = null; currentPct = null;
  document.body.classList.add('in-reader');
  $('reader').style.display = 'block';
  $('reader').classList.remove('hide-chrome'); chromeShown = true;
  closePanels();
  syncInset();
  $('rtitle').textContent = titleOf(path);
  $('rprog').textContent = 'Opening...';
  $('rslider').disabled = true; $('rslider').value = 0;
  try {
    var rowP = fetchRow(path);
    var r = await fetch(api('file', { path: path }));
    if (!r.ok) throw new Error('file ' + r.status);
    var buf = await r.arrayBuffer();
    var row = await rowP;
    var saved = row && row.kind === 'epub' ? row.position : undefined;

    book = ePub(buf, { openAs: 'binary' });
    var myBook = book;
    rendition = book.renderTo('viewer', { width: '100%', height: '100%', flow: 'paginated', spread: 'none' });
    registerThemes();
    applyReaderPrefs();
    rendition.on('relocated', onRelocated);
    rendition.on('keyup', keyNav);
    await rendition.display(saved);
    epubReady = true;

    book.loaded.metadata.then(function (md) {
      if (md && md.title) { var m = metaGet(path) || {}; m.title = md.title.trim(); m.author = (md.creator || '').trim(); cacheSet('meta:' + path, JSON.stringify(m)); if (epubPath === path) $('rtitle').textContent = m.title; }
    }).catch(function () {});
    if (!cacheGet('cv:' + path)) {
      book.coverUrl().then(function (u) { return u ? makeThumb(u, 420) : null; }).then(function (th) { if (th) cacheSet('cv:' + path, th); }).catch(function () {});
    }
    book.loaded.navigation.then(function (nav) { if (book === myBook) buildToc(nav.toc || []); }).catch(function () {});
    startLocations(myBook, path);
  } catch (e) {
    $('rprog').textContent = 'Could not open the book (' + e + ')';
  }
}

function startLocations(myBook, path) {
  var cached = cacheGet('loc:' + path);
  if (cached) { try { myBook.locations.load(cached); locReady = true; updateProgress(); return; } catch (e) {} }
  $('rprog').textContent = 'Counting pages...';
  myBook.ready.then(function () { return myBook.locations.generate(1600); }).then(function () {
    if (book !== myBook) return;
    locReady = true;
    try { cacheSet('loc:' + path, myBook.locations.save()); } catch (e) {}
    updateProgress();
  }).catch(function () {});
}

function registerThemes() {
  Object.keys(THEMES).forEach(function (k) {
    var t = THEMES[k];
    rendition.themes.register(k, {
      body: { color: t.fg + ' !important', background: t.bg + ' !important' },
      a: { color: t.fg + ' !important' }
    });
  });
}
function applyReaderPrefs() {
  $('reader').setAttribute('data-theme', P.theme);
  $('fVal').textContent = P.fontPct + '%';
  ['segTheme', 'segFont', 'segSpace'].forEach(function (id) {
    var cur = id === 'segTheme' ? P.theme : id === 'segFont' ? P.font : P.lh;
    var bs = $(id).children;
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].dataset.v === cur);
  });
  if (!rendition) return;
  rendition.themes.select(P.theme);
  rendition.themes.fontSize(P.fontPct + '%');
  rendition.themes.font(FONTS[P.font]);
  rendition.themes.override('line-height', P.lh, true);
}
function setPref(k, v, store) { P[k] = v; cacheSet(store, String(v)); applyReaderPrefs(); }
$('segTheme').onclick = function (e) { if (e.target.dataset.v) setPref('theme', e.target.dataset.v, 'rTheme'); };
$('segFont').onclick = function (e) { if (e.target.dataset.v) setPref('font', e.target.dataset.v, 'rFont'); };
$('segSpace').onclick = function (e) { if (e.target.dataset.v) setPref('lh', e.target.dataset.v, 'rLh'); };
$('fMinus').onclick = function () { setPref('fontPct', Math.max(70, P.fontPct - 10), 'fontPct'); };
$('fPlus').onclick = function () { setPref('fontPct', Math.min(220, P.fontPct + 10), 'fontPct'); };
applyReaderPrefs();

function buildToc(toc) {
  var box = $('tocList'); box.innerHTML = '';
  (function walk(items, depth) {
    items.forEach(function (it) {
      var d = el('div', 'toc', (it.label || '').trim()); d.style.paddingLeft = (4 + depth * 16) + 'px'; d.dataset.href = (it.href || '').split('#')[0];
      d.onclick = function () { closePanels(); if (rendition) rendition.display(it.href); };
      box.appendChild(d);
      if (it.subitems && it.subitems.length) walk(it.subitems, depth + 1);
    });
  })(toc, 0);
  if (!box.children.length) box.appendChild(el('div', 'empty', 'This book has no table of contents.'));
}

function onRelocated(loc) {
  currentCfi = loc.start.cfi;
  var href = (loc.start.href || '').split('#')[0], nodes = $('tocList').children;
  for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('now', !!href && !!nodes[i].dataset.href && (href.endsWith(nodes[i].dataset.href) || nodes[i].dataset.href.endsWith(href)));
  currentPct = locReady ? book.locations.percentageFromCfi(currentCfi) : approxPct(loc);
  showProgress();
  saveEpub(false);
}
function approxPct(loc) {
  try {
    var n = book.spine.items.length, d = loc.start.displayed;
    return Math.min(1, Math.max(0, (loc.start.index + (d.page - 1) / Math.max(1, d.total)) / n));
  } catch (e) { return null; }
}
function updateProgress() {
  if (!book || !currentCfi) { $('rslider').disabled = !locReady; return; }
  if (locReady) currentPct = book.locations.percentageFromCfi(currentCfi);
  showProgress();
}
function showProgress() {
  if (currentPct == null) return;
  $('rprog').textContent = (locReady ? '' : '~') + Math.round(currentPct * 100) + '%' + (locReady ? '' : ' (counting pages...)');
  $('rslider').disabled = !locReady;
  $('rslider').value = Math.round(currentPct * 1000);
}
$('rslider').addEventListener('input', function () { $('rprog').textContent = Math.round(this.value / 10) + '%'; });
$('rslider').addEventListener('change', function () {
  if (!locReady || !rendition) return;
  var cfi = book.locations.cfiFromPercentage(this.value / 1000);
  if (cfi) rendition.display(cfi);
});

function saveEpub(force) {
  if (!epubPath || !epubReady || !currentCfi) return;
  var now = Date.now();
  if (!force && now - lastESave < 3000) return;
  lastESave = now;
  postPos({ path: epubPath, kind: 'epub', position: currentCfi, progress: currentPct });
}

function keyNav(e) {
  if (!rendition || $('reader').style.display !== 'block') return;
  if (e.key === 'ArrowRight') rendition.next();
  if (e.key === 'ArrowLeft') rendition.prev();
}
document.addEventListener('keyup', keyNav);
$('rPrev').onclick = function () { if (rendition) rendition.prev(); };
$('rNext').onclick = function () { if (rendition) rendition.next(); };

/* tap and swipe on a transparent layer over the page */
(function () {
  var zones = $('zones'), pt = null;
  zones.addEventListener('pointerdown', function (e) { pt = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  zones.addEventListener('pointercancel', function () { pt = null; });
  zones.addEventListener('pointerup', function (e) {
    if (!pt || !rendition) { pt = null; return; }
    var dx = e.clientX - pt.x, dy = e.clientY - pt.y, dt = Date.now() - pt.t; pt = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) { if (dx < 0) rendition.next(); else rendition.prev(); return; }
    if (Math.abs(dx) < 14 && Math.abs(dy) < 14 && dt < 600) {
      var rect = zones.getBoundingClientRect(), x = e.clientX - rect.left;
      if (x < rect.width * 0.3) rendition.prev();
      else if (x > rect.width * 0.7) rendition.next();
      else toggleChrome();
    }
  });
})();
function toggleChrome() { chromeShown = !chromeShown; $('reader').classList.toggle('hide-chrome', !chromeShown); }

function openPanel(id) { closePanels(); $('panelBack').style.display = 'block'; $(id).style.display = 'block'; }
function closePanels() { $('panelBack').style.display = 'none'; $('tocPanel').style.display = 'none'; $('aaPanel').style.display = 'none'; }
$('panelBack').onclick = closePanels;
$('rToc').onclick = function () { openPanel('tocPanel'); };
$('rAa').onclick = function () { openPanel('aaPanel'); };

function closeReader(silent) {
  saveEpub(true);
  try { if (rendition) rendition.destroy(); } catch (e) {}
  try { if (book) book.destroy(); } catch (e) {}
  rendition = null; book = null; epubPath = null; epubReady = false; locReady = false; currentCfi = null; currentPct = null;
  $('viewer').innerHTML = '';
  $('reader').style.display = 'none';
  document.body.classList.remove('in-reader');
  closePanels();
  if (!silent) loadShelf();
}
$('rClose').onclick = function () { closeReader(); };

/* ================= settings + start ================= */
function openSettings() { $('base').value = cfg.base; $('key').value = cfg.key; $('settings').classList.add('open'); }
$('btnSettings').onclick = openSettings;
$('btnCancel').onclick = function () { $('settings').classList.remove('open'); };
$('btnSave').onclick = function () {
  cfg.base = $('base').value.trim(); cfg.key = $('key').value.trim();
  localStorage.setItem('base', cfg.base); localStorage.setItem('key', cfg.key);
  $('settings').classList.remove('open');
  start();
};

function start() {
  if (!cfg.base || !cfg.key) { openSettings(); return; }
  setTab(curTab);
  loadShelf();
  handleDeepLink();
}
start();
</script>
