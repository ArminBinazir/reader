<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1c1a; --muted: #77746d; --line: #e4e1da; --card: #ffffff; --accent: #2f5d50;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #ecebe7; --muted: #9a978f; --line: #2b2a28; --card: #1e1d1b; --accent: #7fb5a3; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; line-height: 1.4; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 220px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 6px; }
  button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  input { font: inherit; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); margin: 4px 0 12px; }
  .row { padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; word-break: break-word; }
  .row small { display: block; color: var(--muted); }
  .row.disabled { opacity: .45; cursor: default; }
  #crumb { color: var(--muted); font-size: 14px; word-break: break-all; }
  #settings { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  #player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: none; }
  #player .inner { max-width: 640px; margin: 0 auto; }
  #title { font-weight: 600; word-break: break-word; }
  #status { color: var(--muted); font-size: 13px; min-height: 18px; }
  audio { width: 100%; margin: 8px 0; }
  .btns button { margin-right: 6px; }
  #reader { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: var(--bg); display: none; flex-direction: column; z-index: 5;
            padding-top: env(safe-area-inset-top, 0px); }
  #rbar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #rtitle { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #viewer { flex: 1; min-height: 0; position: relative; }
  #rfoot { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
  #player { z-index: 10; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Reader</h1>
    <button onclick="toggleSettings()">Settings</button>
  </header>

  <div id="settings">
    <label>Server address (ends with /reader)</label>
    <input id="base" placeholder="https://YOUR-PROJECT-REF.supabase.co/functions/v1/reader" autocapitalize="off" autocorrect="off">
    <label>Access key</label>
    <input id="key" type="password" placeholder="Your APP_TOKEN" autocapitalize="off" autocorrect="off">
    <button class="primary" onclick="saveSettings()">Save</button>
  </div>

  <div id="msg" style="color:#b3261e"></div>

  <h2>Continue</h2>
  <div id="continue"></div>

  <h2>Library</h2>
  <div id="crumb"></div>
  <div id="list"></div>
</main>

<div id="reader">
  <div id="rbar">
    <button onclick="closeReader()">Close</button>
    <div id="rtitle"></div>
    <button onclick="fontStep(-10)">A-</button>
    <button onclick="fontStep(10)">A+</button>
  </div>
  <div id="viewer"></div>
  <div id="rfoot">
    <button onclick="if (rendition) rendition.prev()">Prev</button>
    <span id="rprog"></span>
    <button onclick="if (rendition) rendition.next()">Next</button>
  </div>
</div>

<div id="player">
  <div class="inner">
    <div id="title"></div>
    <div id="status"></div>
    <audio id="audio" controls preload="metadata" playsinline></audio>
    <div class="btns">
      <button onclick="skip(-30)">Back 30s</button>
      <button onclick="skip(30)">Forward 30s</button>
      <button onclick="cycleSpeed()">Speed <span id="sp">1</span>x</button>
    </div>
  </div>
</div>

<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
<script>
var audio = document.getElementById('audio');
function $(id) { return document.getElementById(id); }

var cfg = { base: localStorage.getItem('base') || '', key: localStorage.getItem('key') || '' };
var currentPath = null;
var restored = false;
var lastSave = 0;
var AUDIO_EXT = /\.(mp3|m4b|m4a|ogg|opus)$/i;

function api(route, params) {
  var u = new URL(cfg.base.replace(/\/+$/, '') + '/' + route);
  for (var k in (params || {})) u.searchParams.set(k, params[k]);
  u.searchParams.set('key', cfg.key);
  return u.toString();
}

function nameOf(p) {
  var parts = p.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : '/';
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var mm = (h ? String(m).padStart(2, '0') : m), ss = String(s).padStart(2, '0');
  return (h ? h + ':' : '') + mm + ':' + ss;
}

function showMsg(t) { $('msg').textContent = t || ''; }

/* ---------- settings ---------- */
function toggleSettings() {
  var s = $('settings');
  s.style.display = s.style.display === 'block' ? 'none' : 'block';
  $('base').value = cfg.base;
  $('key').value = cfg.key;
}
function saveSettings() {
  cfg.base = $('base').value.trim();
  cfg.key = $('key').value.trim();
  localStorage.setItem('base', cfg.base);
  localStorage.setItem('key', cfg.key);
  $('settings').style.display = 'none';
  start();
}

/* ---------- library ---------- */
function addRow(parent, title, sub, fn, disabled) {
  var d = document.createElement('div');
  d.className = 'row' + (disabled ? ' disabled' : '');
  d.textContent = title;
  if (sub) { var s = document.createElement('small'); s.textContent = sub; d.appendChild(s); }
  if (!disabled) d.onclick = fn;
  parent.appendChild(d);
}

async function loadFolder(path) {
  showMsg('');
  $('crumb').textContent = path;
  var list = $('list');
  list.innerHTML = '';
  try {
    var r = await fetch(api('list', { path: path }));
    if (!r.ok) { showMsg('Could not load the library (error ' + r.status + '). Check Settings.'); return; }
    var items = await r.json();
    if (path !== '/') {
      var parts = path.split('/').filter(Boolean); parts.pop();
      var up = parts.length ? '/' + parts.join('/') + '/' : '/';
      addRow(list, '.. up one folder', '', function () { loadFolder(up); });
    }
    items.sort(function (a, b) { return (b.dir - a.dir) || a.path.localeCompare(b.path); });
    items.forEach(function (i) {
      var n = nameOf(i.path);
      if (i.dir) addRow(list, n, 'folder', function () { loadFolder(i.path); });
      else if (AUDIO_EXT.test(i.path)) addRow(list, n, (i.size / 1048576).toFixed(0) + ' MB', function () { openAudio(i.path); });
      else if (/\.epub$/i.test(i.path)) addRow(list, n, 'epub, ' + (i.size / 1048576).toFixed(1) + ' MB', function () { openEpub(i.path); });
    });
  } catch (e) {
    showMsg('Could not reach the server. Check the address in Settings.');
  }
}

async function loadContinue() {
  var box = $('continue');
  box.innerHTML = '';
  try {
    var r = await fetch(api('pos'));
    if (!r.ok) return;
    var rows = await r.json();
    rows.forEach(function (x) {
      var pct = x.progress != null ? Math.round(x.progress * 100) + '%' : '';
      if (x.kind === 'audio') {
        addRow(box, nameOf(x.path), 'audio, at ' + fmt(parseFloat(x.position)) + (pct ? ' (' + pct + ')' : ''), function () { openAudio(x.path); });
      } else {
        addRow(box, nameOf(x.path), 'epub' + (pct ? ', ' + pct : ''), function () { openEpub(x.path); });
      }
    });
    if (!box.children.length) box.textContent = 'Nothing yet.';
  } catch (e) {}
}

/* ---------- audio ---------- */
async function fetchRow(path) {
  try {
    var r = await fetch(api('pos', { path: path }));
    var rows = await r.json();
    return rows[0] || null;
  } catch (e) {}
  return null;
}
async function fetchPos(path) {
  var row = await fetchRow(path);
  return row && row.kind === 'audio' ? (parseFloat(row.position) || 0) : 0;
}

function openAudio(path) {
  currentPath = path;
  restored = false;
  $('player').style.display = 'block';
  syncReaderInset();
  $('title').textContent = nameOf(path);
  $('status').textContent = 'Loading... the first start can take up to about 15 seconds.';
  var posP = fetchPos(path);

  audio.src = api('file', { path: path });
  audio.onloadedmetadata = async function () {
    var s = await posP;
    if (s > 0 && Math.abs(audio.currentTime - s) > 1) audio.currentTime = s;
    restored = true;
    $('status').textContent = s > 0 ? 'Resumed at ' + fmt(s) : '';
  };
  // play() is called right in the tap, which iOS requires
  audio.play().catch(function () { $('status').textContent = 'Tap play to start.'; });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: nameOf(path).replace(/\.[^.]+$/, '') });
    navigator.mediaSession.setActionHandler('seekbackward', function () { skip(-30); });
    navigator.mediaSession.setActionHandler('seekforward', function () { skip(30); });
  }
}

function savePos(force) {
  if (!currentPath || !restored || !isFinite(audio.duration) || audio.duration <= 0) return;
  var now = Date.now();
  if (!force && now - lastSave < 10000) return;
  lastSave = now;
  fetch(api('pos'), {
    method: 'POST',
    keepalive: true,
    body: JSON.stringify({ path: currentPath, kind: 'audio', position: audio.currentTime, progress: audio.currentTime / audio.duration })
  }).catch(function () {});
}

audio.addEventListener('timeupdate', function () { savePos(false); });
audio.addEventListener('pause', function () { savePos(true); });
audio.addEventListener('ended', function () { savePos(true); });
audio.addEventListener('error', function () { if (currentPath) $('status').textContent = 'Playback error. Check the address and key in Settings.'; });
document.addEventListener('visibilitychange', function () { if (document.hidden) savePos(true); });

function skip(d) { audio.currentTime = Math.max(0, audio.currentTime + d); }

var rates = [1, 1.25, 1.5, 1.75, 2, 0.75], ri = 0;
function cycleSpeed() {
  ri = (ri + 1) % rates.length;
  audio.playbackRate = rates[ri];
  $('sp').textContent = rates[ri];
}

/* ---------- epub reader ---------- */
var book = null, rendition = null, epubPath = null, epubReady = false;
var currentCfi = null, currentPct = null, lastESave = 0;
var fontPct = parseInt(localStorage.getItem('fontPct') || '100', 10);

function syncReaderInset() {
  var p = $('player');
  $('reader').style.bottom = (p.style.display === 'block' ? p.offsetHeight : 0) + 'px';
  if (rendition) { try { rendition.resize(); } catch (e) {} }
}

async function openEpub(path) {
  closeReader(true);
  epubPath = path;
  epubReady = false;
  $('reader').style.display = 'flex';
  syncReaderInset();
  $('rtitle').textContent = nameOf(path).replace(/\.epub$/i, '');
  $('rprog').textContent = 'Loading...';
  try {
    var rowP = fetchRow(path);
    var r = await fetch(api('file', { path: path }));
    if (!r.ok) throw new Error('file ' + r.status);
    var buf = await r.arrayBuffer();
    var row = await rowP;
    var saved = row && row.kind === 'epub' ? row.position : undefined;

    book = ePub(buf, { openAs: 'binary' });
    rendition = book.renderTo('viewer', { width: '100%', height: '100%', flow: 'paginated', spread: 'none' });
    applyTheme();
    rendition.on('relocated', onRelocated);
    rendition.on('keyup', keyNav);
    var tx = null;
    rendition.on('touchstart', function (e) { tx = e.changedTouches[0].screenX; });
    rendition.on('touchend', function (e) {
      if (tx === null) return;
      var dx = e.changedTouches[0].screenX - tx; tx = null;
      if (Math.abs(dx) > 50) { if (dx < 0) rendition.next(); else rendition.prev(); }
    });
    await rendition.display(saved);
    epubReady = true;
    $('rprog').textContent = '';
    book.ready.then(function () { return book.locations.generate(1200); }).then(updateProgress).catch(function () {});
  } catch (e) {
    $('rprog').textContent = 'Could not open the book (' + e + ')';
  }
}

function applyTheme() {
  var cs = getComputedStyle(document.documentElement);
  rendition.themes.default({
    body: { color: cs.getPropertyValue('--fg').trim() + ' !important', background: cs.getPropertyValue('--bg').trim() + ' !important', 'line-height': '1.5' }
  });
  rendition.themes.fontSize(fontPct + '%');
}

function fontStep(d) {
  fontPct = Math.min(200, Math.max(70, fontPct + d));
  localStorage.setItem('fontPct', String(fontPct));
  if (rendition) rendition.themes.fontSize(fontPct + '%');
}

function onRelocated(loc) {
  currentCfi = loc.start.cfi;
  updateProgress();
  saveEpub(false);
}

function updateProgress() {
  if (!book || !book.locations || !book.locations.length() || !currentCfi) return;
  currentPct = book.locations.percentageFromCfi(currentCfi);
  $('rprog').textContent = Math.round(currentPct * 100) + '%';
}

function saveEpub(force) {
  if (!epubPath || !epubReady || !currentCfi) return;
  var now = Date.now();
  if (!force && now - lastESave < 3000) return;
  lastESave = now;
  fetch(api('pos'), {
    method: 'POST',
    keepalive: true,
    body: JSON.stringify({ path: epubPath, kind: 'epub', position: currentCfi, progress: currentPct })
  }).catch(function () {});
}

function keyNav(e) {
  if (!rendition) return;
  if (e.key === 'ArrowRight') rendition.next();
  if (e.key === 'ArrowLeft') rendition.prev();
}
document.addEventListener('keyup', keyNav);
window.addEventListener('resize', syncReaderInset);
document.addEventListener('visibilitychange', function () { if (document.hidden) saveEpub(true); });

function closeReader(silent) {
  saveEpub(true);
  try { if (rendition) rendition.destroy(); } catch (e) {}
  try { if (book) book.destroy(); } catch (e) {}
  rendition = null; book = null; epubPath = null; epubReady = false; currentCfi = null; currentPct = null;
  $('viewer').innerHTML = '';
  $('reader').style.display = 'none';
  if (!silent) loadContinue();
}

/* ---------- start ---------- */
function start() {
  if (!cfg.base || !cfg.key) { toggleSettings(); return; }
  loadContinue();
  loadFolder('/');
}
start();
</script>
</body>
</html>
